server:
  port: ${PORT:8096}
  forward-headers-strategy: framework
spring:
  application.name: social-service
  servlet.multipart:
    max-file-size: 10MB
    max-request-size: 11MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/industrend}
    username: ${DATABASE_USER:industrend}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:6}
      connection-init-sql: SET search_path TO industrendindia,pg_catalog
  flyway:
    default-schema: industrendindia
    schemas: industrendindia
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_social_history
management.endpoints.web.exposure.include: health,info
services:
  config.url: ${CONFIG_SERVICE_URL:http://127.0.0.1:8082}
  identity.url: ${IDENTITY_SERVICE_URL:http://127.0.0.1:8081}
  internal-token: ${INTERNAL_SERVICE_TOKEN:dev-only-change-me}
